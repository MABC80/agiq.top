services:
  - type: web
    name: agiq-agent
    runtime: python
    plan: free
    rootDir: agent
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: PUBLIC_URL
        value: https://agent.agiq.top
      - key: MAX_DAILY_MESSAGES
        value: "30"
      - key: MAX_MESSAGES_PER_IP_PER_HOUR
        value: "5"
      - key: MAX_DAILY_ACTIONS
        value: "1000"
      - key: MAX_ACTIONS_PER_IP_PER_HOUR
        value: "60"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        value: mbueno74@hotmail.com
      - key: REPORT_EMAIL_TO
        value: mbueno74@hotmail.com
      - key: ADMIN_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
